name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Thirdparty_ACT: https://github.com/EQAditu/AdvancedCombatTracker/releases/download/3.6.0.275/ACTv3.zip
      Thirdparty_FFXIV_ACT_Plugin: https://raw.githubusercontent.com/ravahn/FFXIV_ACT_Plugin/53dd71c8e6363c94899f507d1d1492e10c8cc972/Releases/FFXIV_ACT_Plugin_SDK_2.0.7.0.zip
      Solution_Name: Cafe.Matcha.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Setup thirdparty dependencies
        run: |
          nuget restore ${{ env.Solution_Name }}

          New-Item -Name "thirdparty" -ItemType "directory" -Force

          Invoke-WebRequest -Uri ${{ env.Thirdparty_ACT }} -OutFile thirdparty\ACT.zip
          Expand-Archive thirdparty\ACT.zip -DestinationPath thirdparty\ACT -Force

          Invoke-WebRequest -Uri ${{ env.Thirdparty_FFXIV_ACT_Plugin }} -OutFile thirdparty\FFXIV_ACT_Plugin.zip
          Expand-Archive thirdparty\FFXIV_ACT_Plugin.zip -DestinationPath thirdparty\FFXIV_ACT_Plugin -Force

          Get-ChildItem .\thirdparty
          Get-ChildItem .\thirdparty\ACT
          Get-ChildItem .\thirdparty\FFXIV_ACT_Plugin

      - name: Build
        run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Find release package and version
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path "bin" -Filter "Cafe.Matcha-*-Release.zip" -File)

          if ($packages.Count -ne 1) {
            throw "Expected exactly one Cafe.Matcha-*-Release.zip in bin, found $($packages.Count)."
          }

          $fileName = $packages[0].Name

          if ($fileName -notmatch '^Cafe\.Matcha-(?<version>\d+(?:\.\d+)+)-Release\.zip$') {
            throw "Cannot extract version from package name: $fileName"
          }

          $version = $Matches.version
          $filePath = "bin/$fileName"

          "version=$version" >> $env:GITHUB_OUTPUT
          "file=$filePath" >> $env:GITHUB_OUTPUT

          Write-Host "Release version: $version"
          Write-Host "Release package: $filePath"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bundle
          path: ${{ steps.package.outputs.file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: ${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.package.outputs.file }}
          token: ${{ github.token }}
